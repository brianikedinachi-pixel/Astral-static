<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#6a5cff">
  <title>Astral Chat</title>
  <link rel="stylesheet" href="styles/index.css">
  <link rel="stylesheet" href="styles/response-style.css">
  <!-- marked.js for markdown rendering -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    /* ── USER AVATAR / TOP-RIGHT ── */
    .user-menu-wrap{
      position:absolute;right:12px;top:50%;transform:translateY(-50%);
      display:flex;align-items:center;gap:8px;z-index:1100;
    }
    .avatar-btn{
      width:36px;height:36px;border-radius:50%;
      border:2px solid #00eaff;
      background:linear-gradient(135deg,#00eaff,#8a2be2);
      cursor:pointer;display:flex;align-items:center;justify-content:center;
      font-weight:bold;font-size:0.95rem;color:#041018;
      transition:box-shadow 0.2s;position:relative;flex-shrink:0;
    }
    .avatar-btn:hover{box-shadow:0 0 14px rgba(0,234,255,0.7);}

    .user-dropdown{
      display:none;position:fixed;right:12px;top:70px;
      background:#05080f;border:1px solid rgba(0,234,255,0.35);
      border-radius:14px;width:210px;z-index:2000;
      box-shadow:0 8px 30px rgba(0,0,0,0.6);overflow:hidden;
    }
    .user-dropdown.open{display:block;}
    .dd-header{
      padding:12px 14px;background:rgba(0,234,255,0.07);
      border-bottom:1px solid rgba(0,234,255,0.15);
    }
    .dd-header strong{display:block;color:#00eaff;font-size:0.93rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .dd-header small{color:#6b8ca8;font-size:0.74rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;}
    .dd-item{
      padding:11px 14px;cursor:pointer;color:#c8e6ff;font-size:0.88rem;
      display:flex;align-items:center;gap:8px;transition:background 0.15s;
      border:none;background:none;width:100%;text-align:left;
    }
    .dd-item:hover{background:rgba(0,234,255,0.1);}
    .dd-item.danger{color:#ff6b6b;}
    .dd-item.danger:hover{background:rgba(255,107,107,0.1);}

    /* ── IMAGE ATTACH ── */
    .attach-btn{
      background:transparent;
      border:1px solid rgba(0,234,255,0.35);border-radius:10px;
      color:#00eaff;cursor:pointer;
      display:flex;align-items:center;justify-content:center;
      width:40px;height:40px;flex-shrink:0;transition:all 0.2s;
      position:relative;
    }
    .attach-btn:hover{background:rgba(0,234,255,0.15);border-color:#00eaff;}
    .attach-btn svg{width:19px;height:19px;}
    #file-input{display:none;}
    #file-input-gallery{display:none;}

    /* ── CAMERA CHOICE POPUP ── */
    .camera-choice-popup{
      display:none;position:fixed;
      bottom:72px;left:12px;
      background:#05080f;
      border:1px solid rgba(0,234,255,0.45);
      border-radius:14px;padding:8px;
      z-index:2000;min-width:180px;
      box-shadow:0 -4px 20px rgba(0,234,255,0.25);
      animation:popIn 0.18s ease;
    }
    .camera-choice-popup.show{display:flex;flex-direction:column;gap:4px;}
    .cam-choice-btn{
      background:none;border:none;color:#c8e6ff;
      padding:10px 14px;text-align:left;cursor:pointer;
      font-size:0.9rem;border-radius:9px;
      display:flex;align-items:center;gap:10px;
      transition:background 0.15s;
    }
    .cam-choice-btn:hover{background:rgba(0,234,255,0.12);}
    .cam-choice-btn svg{width:18px;height:18px;color:#00eaff;flex-shrink:0;}
    @keyframes popIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}

    /* ── IMAGE PREVIEW BAR ── */
    .img-preview-bar{
      display:none;padding:6px 12px;
      background:rgba(0,234,255,0.06);
      border-top:1px solid rgba(0,234,255,0.12);
      align-items:center;gap:10px;flex-shrink:0;
    }
    .img-preview-bar.show{display:flex;}
    .img-thumb{width:46px;height:46px;object-fit:cover;border-radius:8px;border:1px solid rgba(0,234,255,0.3);}
    .img-fname{color:#8fd6ff;font-size:0.82rem;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .img-remove-btn{background:none;border:none;color:#ff6b6b;cursor:pointer;font-size:1.1rem;padding:0 4px;}

    /* ── CHAT IMAGES ── */
    .chat-img{max-width:240px;max-height:200px;object-fit:contain;border-radius:10px;margin-bottom:6px;display:block;border:1px solid rgba(0,234,255,0.2);}
    @media(max-width:480px){.chat-img{max-width:160px;}}

    /* ── RICH TEXT in AI response ── */
    .ai-content h1,.ai-content h2,.ai-content h3{color:#00eaff;margin:1rem 0 0.4rem;line-height:1.3;}
    .ai-content h1{font-size:1.3rem;}
    .ai-content h2{font-size:1.15rem;}
    .ai-content h3{font-size:1rem;}
    .ai-content p{margin-bottom:0.7rem;line-height:1.6;}
    .ai-content ul,.ai-content ol{padding-left:1.4rem;margin-bottom:0.7rem;}
    .ai-content li{margin-bottom:0.3rem;line-height:1.5;}
    .ai-content code{
      background:rgba(0,234,255,0.1);color:#7df9ff;
      padding:1px 6px;border-radius:5px;font-family:monospace;font-size:0.9em;
    }
    .ai-content pre{
      background:rgba(0,10,20,0.7);border:1px solid rgba(0,234,255,0.2);
      border-radius:10px;padding:12px;overflow-x:auto;margin-bottom:0.8rem;
    }
    .ai-content pre code{background:none;padding:0;color:#7df9ff;font-size:0.88rem;}
    .ai-content blockquote{
      border-left:3px solid #00eaff;padding-left:12px;color:#6b8ca8;
      margin:0.6rem 0;font-style:italic;
    }
    .ai-content strong{color:#c8e6ff;font-weight:bold;}
    .ai-content em{color:#a8d8ff;}
    .ai-content hr{border:none;border-top:1px solid rgba(0,234,255,0.2);margin:1rem 0;}
    .ai-content a{color:#00eaff;text-decoration:underline;}
    .ai-content table{width:100%;border-collapse:collapse;margin-bottom:0.8rem;font-size:0.88rem;}
    .ai-content th{border:1px solid rgba(0,234,255,0.3);padding:6px 10px;background:rgba(0,234,255,0.08);color:#00eaff;}
    .ai-content td{border:1px solid rgba(0,234,255,0.15);padding:6px 10px;}

    /* ── REACTION BUTTONS ── */
    .reaction-row{display:flex;gap:8px;margin-top:10px;padding-left:2px;}
    .react-btn{
      background:transparent;border:1px solid rgba(0,234,255,0.18);
      border-radius:20px;padding:4px 12px;
      color:#4a6a88;font-size:0.78rem;cursor:pointer;
      display:flex;align-items:center;gap:5px;transition:all 0.2s;
    }
    .react-btn:hover{border-color:rgba(0,234,255,0.4);color:#8fd6ff;}
    .react-btn.liked{border-color:#00eaff;color:#00eaff;background:rgba(0,234,255,0.1);}
    .react-btn.disliked{border-color:#ff6b6b;color:#ff6b6b;background:rgba(255,107,107,0.08);}

    /* ── INPUT ROW ── */
    .input-inner{
      display:flex;align-items:center;gap:8px;
      padding:10px 12px;
      background:#07111f;
      border-radius:32px;
      border:1.5px solid rgba(0,234,255,0.35);
      box-shadow:0 0 14px rgba(0,234,255,0.18),inset 0 0 12px rgba(0,10,30,0.8);
      margin:8px 10px;
      transition:border-color 0.2s,box-shadow 0.2s;
    }
    .input-inner:focus-within{
      border-color:rgba(0,234,255,0.7);
      box-shadow:0 0 22px rgba(0,234,255,0.3),inset 0 0 12px rgba(0,10,30,0.9);
    }
    .chat-initiate-response{flex-direction:column !important;padding:0 !important;height:auto !important;}

    /* ── MOBILE DROPDOWN — always positioned correctly ── */
    .mobile-dropdown-menu{
      display:none;position:fixed;
      bottom:86px;right:10px;
      background:#07111f;
      border:1.5px solid rgba(0,234,255,0.55);
      border-radius:20px;flex-direction:column;
      gap:6px;padding:10px;
      box-shadow:0 -4px 28px rgba(0,234,255,0.45), 0 0 60px rgba(0,234,255,0.1);
      z-index:9999;min-width:60px;
      animation:popIn 0.18s cubic-bezier(.34,1.4,.64,1);
      align-items:center;
    }
    .mobile-dropdown-menu.active{display:flex !important;}
    .mobile-dropdown-menu button{
      width:44px;
      height:44px;
      border-radius:50%;
      background:#00eaff;
      border:none;
      color:#041018;
      padding:0;
      font-size:0.9rem;
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      font-weight:bold;
      box-shadow:0 0 10px #00eaff;
      transition:background 0.15s, box-shadow 0.15s;
      flex-shrink:0;
    }
    .mobile-dropdown-menu button:hover,
    .mobile-dropdown-menu button:active{background:rgba(0,234,255,0.12);}
    .mobile-dropdown-menu .btn-label{display:none !important;}

    /* ── RESPONSIVE fixes ── */
    @media(max-width:480px){
      .user-menu-wrap{right:8px;}
      .avatar-btn{width:32px;height:32px;font-size:0.85rem;}
      .user-dropdown{width:190px;right:8px;}
      .input-inner{padding:7px 10px;gap:6px;margin:6px 8px;}
      .attach-btn{width:36px;height:36px;}
      .attach-btn svg{width:16px;height:16px;}
      .reaction-row{gap:6px;}
      .react-btn{padding:3px 9px;font-size:0.74rem;}
    }
    @media(max-width:400px){
      .avatar-btn{width:28px;height:28px;font-size:0.78rem;}
      .user-menu-wrap{right:6px;}
      .input-inner{padding:5px 8px;gap:4px;margin:4px 6px;}
      .attach-btn{width:30px;height:30px;}
      .attach-btn svg{width:14px;height:14px;}
      .mobile-dropdown-menu button{width:38px;height:38px;}
    }
    @media(max-width:320px){
      .input-inner{padding:4px 6px;gap:3px;margin:3px 4px;}
      .attach-btn{width:26px;height:26px;}
      .mobile-dropdown-menu button{width:32px;height:32px;}
    }
  </style>
</head>
<body>
  <!-- HEADER -->
  <header>
    <div class="head">
      <button class="sidebar-toggle" aria-label="Toggle sidebar" data-tooltip="Toggle sidebar">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <line x1="3" y1="6" x2="21" y2="6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <line x1="3" y1="12" x2="21" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <line x1="3" y1="18" x2="21" y2="18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
      <div class="logo-wrap">
        <img class="ai-logo" src="img/logo.jpg" alt="Astral">
      </div>
      <h3>ASTRAL</h3>

      <!-- User avatar -->
      <div class="user-menu-wrap">
        <div class="avatar-btn" id="avatar-btn" onclick="toggleDropdown()">
          <span id="avatar-letter">?</span>
        </div>
        <div class="user-dropdown" id="user-dropdown">
          <div class="dd-header">
            <strong id="dd-name">User</strong>
            <small id="dd-email">email</small>
          </div>
          <button class="dd-item" onclick="goSettings()">⚙️ Settings</button>
          <button class="dd-item danger" onclick="doLogout()">🚪 Log Out</button>
        </div>
      </div>
    </div>
  </header>

  <!-- SIDEBAR -->
  <aside class="chat-sidebar">
    <button class="new-chat-btn" data-tooltip="New conversation">
      <span class="btn-icon">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <line x1="12" y1="5" x2="12" y2="19" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <line x1="5" y1="12" x2="19" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </span>
      <span class="btn-label">New Chat</span>
    </button>
    <div class="chat-history-list js-chat-history-list"></div>
  </aside>

  <!-- CHAT DISPLAY -->
  <main>
    <div class="chat-display-container js-chat-display-container"></div>
  </main>

  <!-- INPUT AREA -->
  <div class="chat-initiate-response">
    <!-- Image preview -->
    <div class="img-preview-bar" id="img-preview-bar">
      <img class="img-thumb" id="img-thumb" src="" alt="">
      <span class="img-fname" id="img-fname">image.jpg</span>
      <button class="img-remove-btn" onclick="removeImage()" title="Remove">✕</button>
    </div>

    <!-- Input row -->
    <div class="input-inner">
      <!-- Camera / image attach -->
      <button type="button" class="attach-btn" id="attach-btn" onclick="toggleCameraChoice(event)" title="Add image">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="3"/>
          <circle cx="8.5" cy="8.5" r="1.5" fill="currentColor" stroke="none"/>
          <polyline points="21 15 16 10 5 21"/>
        </svg>
      </button>

      <!-- Camera-first hidden input (opens camera on mobile) -->
      <input type="file" id="file-input" accept="image/*" capture="environment" onchange="handleFileSelect(event)">
      <!-- Gallery fallback input -->
      <input type="file" id="file-input-gallery" accept="image/*" onchange="handleFileSelect(event)">

      <!-- Camera choice popup -->
      <div class="camera-choice-popup" id="camera-choice-popup">
        <button type="button" class="cam-choice-btn" onclick="openCamera()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
          Take Photo
        </button>
        <button type="button" class="cam-choice-btn" onclick="openGallery()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5" fill="currentColor" stroke="none"/><polyline points="21 15 16 10 5 21"/></svg>
          Choose from Gallery
        </button>
      </div>

      <textarea
        placeholder="Ask me anything…"
        class="chat-response js-chat-response"
        id="user-input"
        rows="1"
        autocomplete="off"
        autocorrect="on"
        spellcheck="true"
      ></textarea>

      <button type="button" class="chat-answer-button js-chat-answer-button" aria-label="Send" data-tooltip="Send message">
        <span class="btn-icon send-arrow">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 4L12 20M5 11L12 4L19 11" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
        </span>
        <span class="btn-icon send-stop" aria-hidden="true">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><rect x="7" y="7" width="10" height="10" rx="2" fill="currentColor"/></svg>
        </span>
        <span class="btn-label">Send</span>
      </button>

      <!-- Desktop extras -->
      <div class="desktop-buttons">
        <button class="voice-toggle" aria-pressed="true" data-tooltip="Toggle voice">
          <span class="btn-icon"><svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M11 5L6 9H3v6h3l5 4z" fill="currentColor"/><path d="M16 8a4 4 0 0 1 0 8" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg></span>
          <span class="btn-label">Voice : ON</span>
        </button>
        <button class="speech-toggle" aria-pressed="false" data-tooltip="Speech input">
          <span class="btn-icon"><svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><rect x="9" y="3" width="6" height="12" rx="3" fill="currentColor"/><path d="M12 19v3M8 22h8" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
          <span class="btn-label">Speech : OFF</span>
        </button>
      </div>

      <!-- Mobile ⋮ -->
      <button type="button" class="mobile-menu-toggle" aria-label="More options">
        <span class="btn-icon"><svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="6" r="2" fill="currentColor"/><circle cx="12" cy="12" r="2" fill="currentColor"/><circle cx="12" cy="18" r="2" fill="currentColor"/></svg></span>
      </button>
      <div class="mobile-dropdown-menu">
        <button class="voice-toggle" aria-pressed="true"><span class="btn-icon"><svg viewBox="0 0 24 24"><path d="M11 5L6 9H3v6h3l5 4z" fill="currentColor"/><path d="M16 8a4 4 0 0 1 0 8" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg></span><span class="btn-label">✓ Voice</span></button>
        <button class="speech-toggle" aria-pressed="false"><span class="btn-icon"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="12" rx="3" fill="currentColor"/><path d="M12 19v3M8 22h8" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="btn-label">Speech</span></button>
      </div>
    </div>
  </div>

  <script type="module" src="scripts/brain.js"></script>
</body>
</html>
